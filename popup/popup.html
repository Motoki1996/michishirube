<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>michishirube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <!-- アイコンと同じ形のロゴ（道と、その先に灯る標） -->
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4f46e5"/>
          <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="22.5" fill="url(#logo-bg)"/>
      <path d="M27 75 C27 46 69 66 69 31" fill="none" stroke="#fff" stroke-width="10.4" stroke-linecap="round"/>
      <circle cx="69" cy="27" r="13.5" fill="#fff"/>
      <circle cx="69" cy="27" r="9.5" fill="#ffb81c"/>
    </svg>
    <div>
      <h1>michishirube</h1>
      <p class="tagline">操作を、道しるべに。</p>
    </div>
  </header>

  <div class="record-buttons">
    <button id="record-quick" class="rec rec-primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      <span class="rec-title">すばやく記録</span>
      <span class="rec-sub">操作するだけで自動記録</span>
    </button>
    <button id="record-comment" class="rec rec-soft">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/></svg>
      <span class="rec-title">コメントしながら記録</span>
      <span class="rec-sub">1操作ごとに説明を添える</span>
    </button>
  </div>

  <div id="draft" class="message info" hidden></div>
  <div id="message" class="message" hidden></div>

  <section>
    <h2>保存済みのツアー</h2>
    <ul id="tours" class="tours"></ul>
    <p id="empty" class="empty" hidden>まだツアーがありません。<br>「すばやく記録」から始めてみましょう。</p>
  </section>

  <section class="import">
    <button id="import" class="btn">JSONファイルをインポート</button>
    <button id="paste-toggle" class="btn">貼り付けてインポート</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <div id="paste-area" hidden>
      <textarea id="paste-text" placeholder="コピーしたJSONをここに貼り付け"></textarea>
      <button id="paste-import" class="btn small primary">インポート</button>
    </div>
  </section>

  <footer>
    <button id="pick-mode" class="link">要素を選んで手順を作る（クリックを止めて選択）</button>
  </footer>

  <script src="../lib/schema.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
